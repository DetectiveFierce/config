# Laptop profile (single monitor)
monitor=,preferred,auto,2
exec-once = hyprctl dispatch workspace 1

# Laptop hardware/function keys. Brightness targets the internal backlight.
bind = , XF86MonBrightnessDown, exec, ~/.local/bin/wm-brightness down
bind = , XF86MonBrightnessUp, exec, ~/.local/bin/wm-brightness up
bind = , F2, exec, ~/.local/bin/wm-brightness down
bind = , F3, exec, ~/.local/bin/wm-brightness up
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86Back, exec, playerctl previous
bind = , XF86Forward, exec, playerctl next
bind = , F4, togglespecialworkspace, htop
